# Generated by the extension's `manifest` command; edit the extension's documentation in code instead.
image = "ghcr.io/clintjedwards/gofer/extensions/interval:0.12.0"
documentation = "You can find more information on this extension at the official Gofer docs site: https://clintjedwards.com/gofer/ref/extensions/provided/interval.html"

[[config_params]]
key = "min_interval"
required = false
secret = false
default = "1m"
documentation = "The minimum interval pipelines can set for the 'every' parameter. Supports golang native duration strings: https://pkg.go.dev/time#ParseDuration. Examples: '1m', '60s', '3h', '3m30s'."

[[pipeline_subscription_params]]
key = "every"
required = true
secret = false
default = ""
documentation = "'every' is the time between pipeline runs. Supports golang native duration strings: https://pkg.go.dev/time#ParseDuration. Examples: '1m', '60s', '3h', '3m30s'"
