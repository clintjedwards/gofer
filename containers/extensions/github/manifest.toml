# Generated by the extension's `manifest` command; edit the extension's documentation in code instead.
image = "ghcr.io/clintjedwards/gofer/extensions/github:0.12.0"
documentation = "You can find more information on this extension at the official Gofer docs site: https://gofer.clintjedwards.com/docs/ref/extensions/provided/github.html"

[[config_params]]
key = "app_id"
required = true
secret = false
default = ""
documentation = "The Github app's ID, shown on the app's settings page."

[[config_params]]
key = "app_installation"
required = true
secret = false
default = ""
documentation = "The ID of the app's installation on your account or organization. It's the number at the end of the installation's settings URL, and it's also included in every webhook payload."

[[config_params]]
key = "app_key"
required = true
secret = true
default = ""
documentation = "The Github app's private key in PEM format, exactly as Github gives it to you. See: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps"

[[config_params]]
key = "app_webhook_secret"
required = true
secret = true
default = ""
documentation = "The webhook secret set on the Github app. Gofer uses it to verify that webhooks really came from Github. It should be a long, random string."

[[pipeline_subscription_params]]
key = "event_filter"
required = true
secret = false
default = ""
documentation = "The event/action combination the pipeline will be triggered upon. It's presented in the form: <event>/<action>,<action2>... For events that do not have actions or if you simply want to trigger on any action, just putting the <event> wil suffice. To be clear if you don't include actions on an event that has multiple, Gofer will be triggered on any action. you can find a list of events and their actions here(Actions listed as 'activity type'): https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows."

[[pipeline_subscription_params]]
key = "repository"
required = true
secret = false
default = ""
documentation = "The repository the pipeline will be alerted for. The format is <organization>/<repository> Ex: clintjedwards/gofer"
