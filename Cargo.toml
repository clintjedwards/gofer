[workspace]
members = [
    "gofer",
    "sdk/rust",
    "examplePipelines/rust/simple",
    "examplePipelines/rust/secrets",
    "examplePipelines/rust/objects",
    "examplePipelines/rust/dag",
    "examplePipelines/rust/script",
    "examplePipelines/rust/images",
    "examplePipelines/rust/run_folder",
    "champagne/run_tests",
]

resolver = "3"

[profile.dev]
# Disabling debug info speeds up builds a bunch,
# and we don't rely on it for debugging that much.
debug = 0

# Image layers get hashed and decompressed, which is over ten times slower without optimizations.
[profile.dev.package]
crc32fast = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
sha2 = { opt-level = 3 }
zstd-sys = { opt-level = 3 }
