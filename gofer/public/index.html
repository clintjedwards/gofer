<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/main.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.ico">
    <script>
      // Applied before first paint so dark mode doesn't flash light while the page loads.
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
    <script src="common.js" defer></script>
    <script src="main.js" defer></script>
    <title>Gofer</title>
  </head>
  <body class="dark:bg-neutral-800 bg-white text-gray-900 dark:text-gray-100">
    <header id="site-header"></header>

    <main class="mx-auto max-w-6xl px-6 pt-10 pb-24 space-y-12">
      <div id="dashboard-error" class="hidden rounded-md border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/40 p-6 text-sm text-red-800 dark:text-red-200"></div>

      <section>
        <div class="flex flex-wrap items-baseline justify-between gap-4">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">Overview</h1>
            <p id="sample-note" class="mt-1 text-sm text-gray-600 dark:text-gray-300"></p>
          </div>
          <div id="namespace-picker" class="text-sm"></div>
        </div>
        <div id="stats" class="mt-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-px overflow-hidden rounded-md ring-1 ring-gray-200 dark:ring-neutral-700 bg-gray-200 dark:bg-neutral-700"></div>
      </section>

      <section>
        <div class="flex flex-wrap items-baseline justify-between gap-4">
          <div>
            <h2 class="text-base font-semibold">Recent runs</h2>
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">The latest runs across every pipeline. Click a run for its details.</p>
          </div>
          <div id="run-filter" class="hidden inline-flex rounded-md ring-1 ring-gray-200 dark:ring-neutral-700 p-0.5 text-xs"></div>
        </div>
        <div class="mt-4 overflow-x-auto rounded-md ring-1 ring-gray-200 dark:ring-neutral-700">
          <table class="min-w-full divide-y divide-gray-200 dark:divide-neutral-700 text-sm">
            <thead class="bg-gray-50 dark:bg-neutral-900/40">
              <tr class="text-left text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">
                <th scope="col" class="px-4 py-3 font-medium">Run</th>
                <th scope="col" class="px-4 py-3 font-medium">Status</th>
                <th scope="col" class="px-4 py-3 font-medium">Started</th>
                <th scope="col" class="px-4 py-3 font-medium">Duration</th>
                <th scope="col" class="px-4 py-3 font-medium">Initiator</th>
                <th scope="col" class="px-4 py-3"><span class="sr-only">Details</span></th>
              </tr>
            </thead>
            <tbody id="run-list-body" class="divide-y divide-gray-200 dark:divide-neutral-700"></tbody>
          </table>
        </div>
      </section>

      <section id="attention-section" class="hidden">
        <h2 class="text-base font-semibold">Needs attention</h2>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Pipelines whose most recent finished run failed.</p>
        <div id="attention" class="mt-4 grid gap-4 md:grid-cols-2"></div>
      </section>

      <section>
        <div class="flex flex-wrap items-baseline justify-between gap-4">
          <div>
            <h2 class="text-base font-semibold">Activity</h2>
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Runs started per day over the last two weeks, by outcome.</p>
          </div>
          <div id="activity-legend" class="flex flex-wrap gap-4 text-xs text-gray-600 dark:text-gray-300"></div>
        </div>
        <div id="activity" class="mt-4 rounded-md ring-1 ring-gray-200 dark:ring-neutral-700 p-4"></div>
      </section>

      <section>
        <div class="flex flex-wrap items-baseline justify-between gap-4">
          <div>
            <h2 class="text-base font-semibold">Pipelines</h2>
            <p id="pipelines-note" class="mt-1 text-sm text-gray-600 dark:text-gray-300"></p>
          </div>
        </div>
        <div id="pipelines" class="mt-4 grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
      </section>

    </main>
  </body>
</html>
