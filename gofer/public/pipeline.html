<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/main.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.ico">
    <script>
      // Applied before first paint so dark mode doesn't flash light while the page loads.
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
    <script src="common.js" defer></script>
    <script src="pipeline.js" defer></script>
    <title>Gofer │ Pipeline</title>
  </head>
  <body class="dark:bg-neutral-800 bg-white text-gray-900 dark:text-gray-100">
    <header id="site-header"></header>

    <main class="mx-auto max-w-6xl px-6 pt-10 pb-24 space-y-8">
      <!-- Shown instead of everything else when the pipeline can't be loaded. -->
      <div id="pipeline-error" class="hidden rounded-md border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/40 p-6 text-sm text-red-800 dark:text-red-200"></div>

      <div id="pipeline-content" class="hidden space-y-8">
        <header id="pipeline-title"></header>

        <section id="attention-section" class="hidden">
          <h2 class="text-base font-semibold">Needs attention</h2>
          <div id="attention" class="mt-4 space-y-2"></div>
        </section>

        <section id="pipeline-summary" class="grid grid-cols-2 lg:grid-cols-4 gap-px overflow-hidden rounded-md ring-1 ring-gray-200 dark:ring-neutral-700 bg-gray-200 dark:bg-neutral-700"></section>

        <div id="pipeline-cli-tips" class="space-y-2"></div>

        <section>
          <h2 class="text-base font-semibold">Recent runs</h2>
          <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Click a run for its details.</p>
          <div class="mt-4 overflow-x-auto rounded-md ring-1 ring-gray-200 dark:ring-neutral-700">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-neutral-700 text-sm">
              <thead class="bg-gray-50 dark:bg-neutral-900/40">
                <tr class="text-left text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">
                  <th scope="col" class="px-4 py-3 font-medium">Run</th>
                  <th scope="col" class="px-4 py-3 font-medium">Status</th>
                  <th scope="col" class="px-4 py-3 font-medium">Started</th>
                  <th scope="col" class="px-4 py-3 font-medium">Duration</th>
                  <th scope="col" class="px-4 py-3 font-medium">Initiator</th>
                  <th scope="col" class="px-4 py-3"><span class="sr-only">Details</span></th>
                </tr>
              </thead>
              <tbody id="run-list-body" class="divide-y divide-gray-200 dark:divide-neutral-700"></tbody>
            </table>
          </div>
        </section>

        <section>
          <h2 class="text-base font-semibold">Tasks</h2>
          <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">The containers each run starts and the order they run in.</p>
          <div id="tasks" class="mt-4"></div>
        </section>

        <section>
          <h2 class="text-base font-semibold">Subscriptions</h2>
          <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Extensions this pipeline is subscribed to.</p>
          <div id="subscriptions" class="mt-4"></div>
        </section>
      </div>
    </main>
  </body>
</html>
