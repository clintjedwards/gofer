[api]
pipeline_run_concurrency_limit = 200
global_run_concurrency_limit = 2000
event_log_retention_seconds = 15768000    # 6 months
event_prune_interval_seconds = 604800     # 1 week
log_level = "info"
task_execution_log_retention_runs = 50
task_execution_logs_dir = "/tmp"
task_execution_stop_timeout_seconds = 300 # 5 mins
task_execution_max_timeout_seconds = 86400 # 24 hours
allow_task_attach = true

[server]
bind_address = "0.0.0.0:8080"
extension_address = "172.17.0.1:8080"
storage_path = "/tmp/gofer.db"
use_tls = false

[development]
pretty_logging = true     # Tells the logging package to use human readable output.
bypass_auth = true        # Turns off auth.
use_included_certs = true # Automatically loads localhost certs for development.

[extensions]
stop_timeout_seconds = 300    # 5 mins
use_tls = false
verify_certs = false          # When attempting to communicate with an extension verify the cert is correct and known.
health_check_interval_seconds = 60
health_check_failures_before_action = 3
health_check_auto_restart = true
health_check_max_restarts = 1

[external_events]
enable = true
bind_address = "0.0.0.0:8081"
use_tls = false

[scheduler]
engine = "docker"

[scheduler.docker]
prune = true
prune_interval_seconds = 604800 # 1 week
timeout_seconds = 300           # Should be the same or more than task_execution_stop_timeout_seconds

[object_store]
engine = "filesystem"
pipeline_object_limit = 50
run_object_expiry_runs = 2

[object_store.filesystem]
path = "/tmp/gofer_objects"

[secret_store]
engine = "sqlite"

[secret_store.sqlite]
path = "/tmp/gofer_secrets.db"
encryption_key = "changemechangemechangemechangeme"
